[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-notify-cli"
version = "0.1.0"
description = "Harness-agnostic Feishu outbound for agents (FNP): text + scene cards via lark-cli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MyWikiTools" }]
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/mxz2023/MyWikiTools"

[project.scripts]
feishu-notify = "feishu_notify.cli:app"
fnotify = "feishu_notify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_notify"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/README.zh.md",
  "/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]