[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-fitness-cli"
version = "0.1.0"
description = "CLI to sync and query Xiaomi Mi Fitness (小米运动健康) cloud data on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MyWikiTools" }]
dependencies = [
  "typer>=0.12.0",
  "requests>=2.31.0",
  "mifit>=0.4.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/mxz2023/MyWikiTools"

[project.scripts]
mi-fitness = "mi_fitness.cli:app"
mfp = "mi_fitness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_fitness"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/README.zh.md",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
