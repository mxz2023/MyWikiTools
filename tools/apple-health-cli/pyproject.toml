[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-health-cli"
version = "0.1.0"
description = "CLI to receive iPhone health sync (AHPSync) and query local SQLite cache"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MyWikiTools" }]
dependencies = [
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/mxz2023/MyWikiTools"

[project.scripts]
apple-health = "apple_health.cli:app"
ahp = "apple_health.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/ios",
  "/README.md",
  "/README.zh.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
