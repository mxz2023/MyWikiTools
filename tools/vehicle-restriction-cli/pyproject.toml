[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-restriction-cli"
version = "0.1.0"
description = "Official-source vehicle tail restriction checker for Beijing and Tianjin"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vehicle-restriction = "vehicle_restriction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
