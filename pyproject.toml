[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-personal-cli"
version = "0.1.0"
description = "CLI for Garmin Connect Personal API (multi-profile, CN default host)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MyWikiTools" }]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "socksio>=1.0.0",
  "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.0",
]

[project.urls]
Repository = "https://github.com/mxz2023/MyWikiTools"

[project.scripts]
garmin-personal = "garmin_personal.cli:app"
gmp = "garmin_personal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_personal"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/README.zh.md",
  "/skills",
  "/.cursor",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
